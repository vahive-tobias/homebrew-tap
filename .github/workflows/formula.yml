name: Formula

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-formula:
    name: brew install + test
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v5

      - name: Tap this checkout
        run: brew tap vahive-tobias/tap "$GITHUB_WORKSPACE"

      - name: Audit the formula
        run: brew audit --strict vahive-tobias/tap/magus-opensecmcp
        continue-on-error: true

      - name: Install from source
        run: brew install --build-from-source vahive-tobias/tap/magus-opensecmcp

      - name: Run the formula's own test block
        run: brew test vahive-tobias/tap/magus-opensecmcp

      - name: Confirm the installed binary actually runs
        run: |
          magus-gateway --version
          magus-gateway --help
